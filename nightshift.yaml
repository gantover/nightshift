# Nightshift configuration.

sandbox:
  agent: opencode        # sbx agent (workload) the night runs in
  kits: [./kit]          # sbx mixins, paths relative to this repo. Add an entry for a
                         # browser or another harness's mixin.
  env:                   # set for every command the runner sends into the sandbox
    OPENCODE_CONFIG: /opt/nightshift/opencode/opencode.json
    OPENCODE_CONFIG_DIR: /opt/nightshift/opencode
    OPENCODE_ENABLE_EXA: "1"   # websearch for non-Go models (hosts allowed in policies/build.sh)
  keep: false            # true = leave the sandbox up after the night for debugging

# Models per agent: the first is preferred; attempt 3 onwards moves down the list
# (Go enforces its own usage caps: a capped model just fails the attempt).
# A bare id runs on OpenCode. Prefix "pi:", "claude-code:" or "codex:" to use that
# harness instead; its CLI must be in the sandbox (add its mixin to sandbox.kits).
models:
  # All local (llama-server on the Z13): a night costs nothing. Add opencode-go/* entries
  # after the local one to fall back to paid models from attempt 3.
  planner:  [local/qwen3.8-flash-next]
  builder:  [local/qwen3.8-flash-next]
  reviewer: [local/qwen3.8-flash-next]
  reporter: [local/qwen3.8-flash-next]

night:
  stopAt: "06:30"           # building stops 30 min earlier; the rest is the report
  taskTimeoutMinutes: 45
  idleTimeoutSeconds: 600
  maxAttempts: 3

ntfyUrl: null               # e.g. https://ntfy.your-rock5.lan/nightshift
